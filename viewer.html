<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; base-uri 'self'; object-src 'none'">
<title>نمایش منبع</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --ink:#10233f; --muted:#667085; --line:#e6e1d6; --bg:#f4f0e6; --card:#fffcf7; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Vazirmatn, Tahoma, sans-serif;
    background: var(--bg);
    color: #1d2430;
    line-height: 2;
  }
  .bar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 14px 22px;
    background: var(--ink);
    color: #fff;
  }
  .bar a, .bar button {
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    padding: 6px 14px;
    text-decoration: none;
    font: inherit;
    cursor: pointer;
  }
  main { max-width: 820px; margin: 0 auto; padding: 36px 20px 80px; }
  article {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(16,35,63,.06);
  }
  h1, h2, h3 { color: var(--ink); line-height: 1.6; }
  h1 { font-size: 1.7rem; margin-top: 0; }
  pre, code { font-family: ui-monospace, Vazirmatn, monospace; }
  pre {
    background: #f6f3ec;
    border-radius: 12px;
    padding: 14px;
    overflow: auto;
    line-height: 1.7;
    direction: ltr;
    text-align: left;
  }
  code { background: #f6f3ec; border-radius: 6px; padding: 0 5px; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 12px 0; padding: 8px 16px; border-right: 4px solid #c6a15b; background: #fbf6ea; }
  img { max-width: 100%; border-radius: 12px; }
  a { color: #1f5fae; }
  .plain { white-space: pre-wrap; font-size: 1rem; }
  .error { color: #8d2f2f; }
</style>
</head>
<body>
<header class="bar">
  <a href="index.html">کتابخانه</a>
  <button id="download" type="button">دانلود</button>
</header>
<main>
  <article id="doc">در حال باز کردن منبع…</article>
</main>
<script src="viewer.js"></script>
</body>
</html>
